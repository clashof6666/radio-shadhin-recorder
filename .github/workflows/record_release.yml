name: Record Stream and Create Release

on:
  schedule:
    # Thursday at 10:00 PM BST (16:00 UTC)
    - cron: '0 16 * * 4'
  workflow_dispatch: # Manual trigger

jobs:
  record_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Record Audio Stream (10 Second Test)
        run: |
          DATE_STR=$(date +'%Y-%m-%d')
          TIME_STR=$(date +'%Y-%m-%d_%H-%M')
          FILE_NAME="Radio_Shadhin_${TIME_STR}.aac"
          
          echo "RECORD_DATE=$DATE_STR" >> $GITHUB_ENV
          echo "RECORD_FILE=$FILE_NAME" >> $GITHUB_ENV

          # Record 10 seconds for testing
          ffmpeg -i "https://stream-281.surfernetwork.com/umq9q5uuva5tv" -t 10 -c copy "$FILE_NAME"

      - name: Create GitHub Release and Upload Audio
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "test-release-${{ env.RECORD_DATE }}"
          name: "Test Recording - ${{ env.RECORD_DATE }}"
          body: "10-second test stream recording."
          draft: false
          prerelease: false
          files: "${{ env.RECORD_FILE }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
