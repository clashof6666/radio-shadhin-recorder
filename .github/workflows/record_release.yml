name: Record Stream and Create Release

on:
  schedule:
    # Thursday at 10:00 PM BST (16:00 UTC)
    - cron: '0 16 * * 4'
  workflow_dispatch: # Manual trigger

jobs:
  record_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Record Audio Stream (10-Second Test)
        run: |
          # Generate unique timestamp
          DATE_TAG=$(date +'%Y-%m-%d_%H-%M-%S')
          FILE_NAME="Radio_Shadhin_${DATE_TAG}.aac"
          
          echo "RECORD_TAG=$DATE_TAG" >> $GITHUB_ENV
          echo "RECORD_FILE=$FILE_NAME" >> $GITHUB_ENV

          # Record 10 seconds for testing
          ffmpeg -i "https://stream-281.surfernetwork.com/umq9q5uuva5tv" -t 10 -c copy "$FILE_NAME"

      - name: Create GitHub Release and Upload Audio
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ env.RECORD_TAG }}"
          name: "Radio Shadhin - ${{ env.RECORD_TAG }}"
          body: "Automated recording of Radio Shadhin."
          draft: false
          prerelease: false
          files: "${{ env.RECORD_FILE }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
